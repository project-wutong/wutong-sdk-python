[package]
name = "wutong-sdk-python"
description = "Python bindings (PyO3) for the Wutong Protocol Rust core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/project-wutong/wutong-sdk-python"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
wutong-core = { git = "https://github.com/project-wutong/wutong-core", branch = "main" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
hex = "0.4"
